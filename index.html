
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FARID MOCK TEST</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#101010;
color:white;
font-family:Arial;
}

header{
padding:20px;
background:#1b1b1b;
border-bottom:2px solid #b99745;
}

h2{color:#d9b65b;margin:0}
header p{color:#bbb}

.container{
max-width:1100px;
margin:30px auto;
padding:15px;
}

.panel{
background:#1b1b1b;
padding:22px;
border-radius:12px;
margin-bottom:20px;
}

input{
width:100%;
padding:14px;
margin:12px 0;
background:#292929;
color:white;
border:1px solid #b99745;
border-radius:8px;
font-size:16px;
}

button{
cursor:pointer;
border:0;
border-radius:8px;
padding:13px;
background:#b99745;
color:#111;
font-weight:bold;
letter-spacing:0 !important;
word-spacing:0 !important;
white-space:nowrap;
}

button:hover{opacity:.85}
.hidden{display:none}

.question{
font-size:20px;
margin:25px 0;
}

.option{
display:block;
width:100%;
text-align:left;
margin:10px 0;
background:#292929;
color:white;
border:1px solid #555;
}

.option.selected{
background:#806522;
border-color:#e5c36b;
color:white;
}

.grid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:8px;
margin-top:15px;
}

.num{
background:#292929;
color:white;
border:1px solid #555;
}

.num.done{background:#806522}

.nav{
display:flex;
justify-content:space-between;
gap:10px;
margin-top:25px;
}

.nav button{flex:1}
.gold{color:#d9b65b}

@media(max-width:700px){
.container{padding:10px}
.panel{padding:15px}
}
</style>
</head>

<body>

<header>
<h2>⭐ FARID MOCK TEST</h2>
<p>MATEMATIKA | PREMIUM MOCK EXAM</p>
</header>

<div class="container">

<section class="panel" id="login">
<h2>♛ TESTGA KIRISH</h2>
<p>Testga kirish uchun maxsus kodni kiriting.</p>

<input
id="accessCode"
type="password"
placeholder="Kirish kodini kiriting">

<button onclick="checkCode()" style="width:100%">
TESTGA KIRISH →
</button>

<p id="error" style="color:#ff7777"></p>
</section>

<section class="panel hidden" id="pdfSection">

<h2>📄 FARID OFFICIAL — MATEMATIKA TEST</h2>
<p>Test savollarini PDF shaklida ko‘ring:</p>

<iframe
src="FARID%20OFFICIAL.pdf"
width="100%"
height="700px"
style="border:2px solid #b99745;border-radius:10px;">
</iframe>

<button
onclick="startExam()"
style="width:100%;margin-top:15px;">
🚀 TESTNI BOSHLASH
</button>

</section>

<section id="exam" class="hidden">

<div class="panel">

<div class="gold">FARID MOCK TEST</div>

<p id="counter">1 / 45</p>

<div id="timer"
style="color:#e5c36b;font-size:32px;font-weight:bold;text-align:center;padding:15px;background:#292929;border:2px solid #b99745;border-radius:10px;margin:15px 0;">
02:30:00
</div>

<div class="question" id="question"></div>
<img id="questionImage" style="display:none; max-width:100%; margin:15px auto;">
<div id="options"></div>
<div class="nav">
<button onclick="move(-1)">← Oldingi</button>
<button onclick="move(1)">Keyingi →</button>
</div>

</div>

<div class="panel">

<h3>📝 JAVOBLAR VARAQASI</h3>

<div class="grid" id="answerGrid"></div>

<p id="progress">Javoblar: 0 / 45</p>

<button onclick="finish()" style="width:100%">
🏁 TESTNI YAKUNLASH
</button>

</div>
</section>

<section id="result" class="panel hidden">

<h2>🏆 TEST YAKUNLANDI!</h2>
<p id="resultText"></p>

<button onclick="location.reload()">
QAYTA BOSHLASH
</button>

</section>

</div>

<script>
  
const ACCESS_CODE = "FARID2026";
  

const answerKey = [
"B","A","A","A","B","D","A",
"B","A","B","C","B","B","C",
"A","A","C","A","A","C","D",
"A","B","A","D","D","C","B",
"C","A","B","B","A","B","C"
];

const writtenKey = [
["6","13.5"],
["π/6","3"],
["-1","4.5"],
["16","1"],
["14","100/3"],
["3√6/4","√6/2"],
["12","25"],
["7/25","7/4"],
["3√2","54π"],
["6","10%"]
];

const questions = Array.from({length:45},(_,i)=>({
    text:`${i+1}-savol.`,
    image: ({
        23: "Без имени.png",
        31: "savol_2.png",
        33: "savol_3.png",
        34: "savol_3.png",
        35: "savol_3.png",
        38: "savol_4.png",
        40: "savol_5.png",
        41: "savol_6.png",
        42: "savol_7.png",
        43: "savol_8.png",
        45: "savol_9.png"
    })[i+1],
    options: i < 35 ? ["A","B","C","D"] : [],
    correct: i < 35 ? answerKey[i] : null,
    correctA: i >= 35 ? writtenKey[i-35][0] : null,
    correctB: i >= 35 ? writtenKey[i-35][1] : null
}));

let current = 0;
let answers = {};
let timerInterval;
let timeLeft = 150 * 60;
let timerStarted = false;

function checkCode(){

const code = document.getElementById("accessCode").value.trim();

if(code === ACCESS_CODE){

document.getElementById("login").classList.add("hidden");
document.getElementById("pdfSection").classList.remove("hidden");

}else{

document.getElementById("error").textContent =
"❌ Kod noto‘g‘ri. Qayta urinib ko‘ring.";

}

}

function startExam(){

document.getElementById("pdfSection").classList.add("hidden");
document.getElementById("exam").classList.remove("hidden");

render();

if(!timerStarted){
startTimer();
timerStarted = true;
}

}

function startTimer(){

const timer = document.getElementById("timer");

timerInterval = setInterval(()=>{

timeLeft--;

const hours = Math.floor(timeLeft / 3600);
const minutes = Math.floor((timeLeft % 3600) / 60);
const seconds = timeLeft % 60;

timer.textContent =
String(hours).padStart(2,"0")+":"+
String(minutes).padStart(2,"0")+":"+
String(seconds).padStart(2,"0");

if(timeLeft <= 0){

clearInterval(timerInterval);
finish(true);

}

},1000);

}


function render(){

document.getElementById("counter").textContent =
(current+1)+" / "+questions.length;

document.getElementById("question").textContent =
questions[current].text;

const img = document.getElementById("questionImage");

if(questions[current].image){
    img.src = "./images/" + encodeURIComponent(questions[current].image);
    img.style.display = "block";
}else{
    img.style.display = "none";
}

const q = questions[current];

if(current < 35){

document.getElementById("options").innerHTML =
q.options.map(x=>
`<button class="option ${answers[current]===x?'selected':''}"
onclick="choose('${x}')">${x}</button>`
).join("");

}else{

document.getElementById("options").innerHTML = `
<p>A javob:</p>
<input value="${answers[current]?.A || ''}"
oninput="writeAnswer('A',this.value)"
placeholder="A javobni kiriting">

<p>B javob:</p>
<input value="${answers[current]?.B || ''}"
oninput="writeAnswer('B',this.value)"
placeholder="B javobni kiriting">
`;

}

document.getElementById("answerGrid").innerHTML =
questions.map((q,i)=>
`<button class="num ${answers[i]?'done':''}"
onclick="go(${i})">${i+1}${answers[i]?' ✓':''}</button>`
).join("");

document.getElementById("progress").textContent =
"Javob belgilangan savollar: "+
Object.keys(answers).length+" / "+questions.length;

}

function writeAnswer(part,value){

if(!answers[current]) answers[current] = {};

answers[current][part] = value;

document.getElementById("progress").textContent =
"Javob belgilangan savollar: "+
Object.keys(answers).length+" / "+questions.length;

}


function choose(x){

answers[current] = x;
render();

}

function go(i){

current = i;
render();

}

function move(d){

current = Math.max(
0,
Math.min(questions.length-1,current+d)
);

render();

}


function normalizeAnswer(value){
return String(value || "")
.toLowerCase()
.replace(/,/g,".")
.replace(/\s+/g,"")
.replace(/−/g,"-")
.replace(/π/g,"pi");
}

function finish(auto=false){

if(!auto && !confirm("Testni yakunlaysizmi?")){
return;
}

clearInterval(timerInterval);

let correct = 0;
let attempted = 0;
let maxScore = 55;

for(let i=0;i<35;i++){

if(answers[i]){
attempted++;
if(answers[i] === questions[i].correct){
correct++;
}
}

}

for(let i=35;i<45;i++){

const user = answers[i] || {};

if(user.A && user.A.trim() !== ""){
attempted++;
if(normalizeAnswer(user.A) === normalizeAnswer(questions[i].correctA)){
correct++;
}
}

if(user.B && user.B.trim() !== ""){
attempted++;
if(normalizeAnswer(user.B) === normalizeAnswer(questions[i].correctB)){
correct++;
}
}

}

const percent = (correct / maxScore * 100).toFixed(1);

document.getElementById("exam").classList.add("hidden");
document.getElementById("result").classList.remove("hidden");

document.getElementById("resultText").textContent =
"To‘g‘ri javoblar: " + correct +
" / " + maxScore +
". Foiz: " + percent + "%" +
". Kiritilgan javoblar: " + attempted +
". Test yakunlandi.";

}

</script>

</body>
</html>
