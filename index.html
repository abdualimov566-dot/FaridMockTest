<style>
:root{--bg:#101010;--panel:#1b1b1b;--gold:#b99745;--gold2:#e5c36b;--muted:#aaa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}
header{padding:20px;background:#1b1b1b;border-bottom:2px solid var(--gold)}
h1,h2,h3{margin-top:0;color:var(--gold2)}
header h1{font-size:24px;margin:0}
header p{color:#bbb;margin-bottom:0}
.container{max-width:1100px;margin:25px auto;padding:0 15px}
.panel{background:var(--panel);padding:22px;border:1px solid #343434;border-radius:12px;margin-bottom:18px}
input{width:100%;padding:13px;margin:9px 0;background:#292929;color:#fff;border:1px solid var(--gold);border-radius:8px;font-size:16px}
button{cursor:pointer;border:0;border-radius:8px;padding:12px 15px;background:var(--gold);color:#111;font-weight:bold}
button:hover{filter:brightness(1.12)}
button:disabled{opacity:.5;cursor:not-allowed}
.hidden{display:none!important}
.gold{color:var(--gold2)}
.question{font-size:20px;line-height:1.65;margin:22px 0;white-space:pre-wrap}
.option{display:block;width:100%;text-align:left;margin:10px 0;background:#292929;color:#fff;border:1px solid #555;white-space:normal;line-height:1.5}
.option.selected{background:#59471e;border:1px solid var(--gold2)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:15px}
.num{background:#292929;color:#fff;border:1px solid #555}
.num.done{background:#806522;color:#fff}
.nav{display:flex;gap:10px;margin-top:22px}
.nav button{flex:1}
#timer{color:var(--gold2);font-size:30px;font-weight:bold;text-align:center;padding:14px;background:#292929;border:2px solid var(--gold);border-radius:10px;margin:15px 0}
#questionImage{display:none;max-width:100%;height:auto;margin:15px auto;border:1px solid var(--gold);border-radius:8px}
.small{font-size:13px;color:var(--muted)}
.result-score{font-size:28px;color:var(--gold2);font-weight:bold}
@media(max-width:600px){.panel{padding:15px}.question{font-size:18px}.grid{grid-template-columns:repeat(5,1fr)}header h1{font-size:20px}}
</style>

// 23-SAVOL
questions[22].image = "savol_23.png";
questions[22].options = ["10", "15", "12", "8"];

let current = 0;
let answers = {};
let timerInterval = null;
let timeLeft = EXAM_SECONDS;
let timerStarted = false;
let examFinished = false;

const $ = id => document.getElementById(id);

$("loginBtn").addEventListener("click", checkCode);
$("accessCode").addEventListener("keydown", e => { if(e.key === "Enter") checkCode(); });
$("startBtn").addEventListener("click", startExam);
$("prevBtn").addEventListener("click", () => move(-1));
$("nextBtn").addEventListener("click", () => move(1));
$("finishBtn").addEventListener("click", () => finish(false));
$("restartBtn").addEventListener("click", () => location.reload());

function checkCode(){
  if($("accessCode").value.trim() === ACCESS_CODE){
    $("login").classList.add("hidden");
    $("pdfSection").classList.remove("hidden");
    $("error").textContent = "";
  } else {
    $("error").textContent = "❌ Kod noto‘g‘ri. Qayta urinib ko‘ring.";
  }
}

function startExam(){
  $("pdfSection").classList.add("hidden");
  $("exam").classList.remove("hidden");
  render();
  if(!timerStarted){
    timerStarted = true;
    startTimer();
  }
}

function updateTimer(){
  const h = Math.floor(timeLeft / 3600);
  const m = Math.floor((timeLeft % 3600) / 60);
  const s = timeLeft % 60;
  $("timer").textContent = [h,m,s].map(v => String(v).padStart(2,"0")).join(":");
}

function startTimer(){
  updateTimer();
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimer();
    if(timeLeft <= 0) finish(true);
  }, 1000);
}

function render(){
  const q = questions[current];
  $("counter").textContent = `${current+1} / ${TOTAL_QUESTIONS}`;
$("question").innerHTML = q.text;

  const img = $("questionImage");
  if(q.image){
    img.src = "./images/" + q.image;
    img.style.display = "block";
  } else {
    img.removeAttribute("src");
    img.style.display = "none";
  }

  if(current < MC_COUNT){
    $("options").innerHTML = q.options.map((option, index) => {
     const letter = current >= 32 ? ["A","B","C","D","E","F"][index] : ["A","B","C","D"][index];
      const selected = answers[current] === letter ? "selected" : "";
      return `<button class="option ${selected}" data-answer="${letter}">${letter}) ${escapeHtml(option)}</button>`;
    }).join("");
    $("options").querySelectorAll("[data-answer]").forEach(btn => {
      btn.addEventListener("click", () => choose(btn.dataset.answer));
    });
  } else {
    const saved = answers[current] || {};
    $("options").innerHTML = `
      <label>A javob:</label>
      <input id="writtenA" value="${escapeAttr(saved.A || "")}" placeholder="A javobni kiriting">
      <label>B javob:</label>
      <input id="writtenB" value="${escapeAttr(saved.B || "")}" placeholder="B javobni kiriting">
    `;
    $("writtenA").addEventListener("input", e => writeAnswer("A", e.target.value));
    $("writtenB").addEventListener("input", e => writeAnswer("B", e.target.value));
  }

  $("answerGrid").innerHTML = questions.map((_, i) => {
    const done = hasAnswer(i);
    return `<button class="num ${done ? "done" : ""}" data-go="${i}">${i+1}${done ? " ✓" : ""}</button>`;
  }).join("");
  $("answerGrid").querySelectorAll("[data-go]").forEach(btn => {
    btn.addEventListener("click", () => go(Number(btn.dataset.go)));
  });

  const count = Object.keys(answers).filter(k => hasAnswer(Number(k))).length;
  $("progress").textContent = `Javob belgilangan savollar: ${count} / ${TOTAL_QUESTIONS}`;
  $("prevBtn").disabled = current === 0;
  $("nextBtn").disabled = current === TOTAL_QUESTIONS - 1;

  if(window.MathJax && window.MathJax.typesetPromise){
    MathJax.typesetPromise([$("question"), $("options")]).catch(()=>{});
  }
}

function escapeHtml(value){
  return String(value).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
}
function escapeAttr(value){ return escapeHtml(value); }

function hasAnswer(i){
  const a = answers[i];
  if(i < MC_COUNT) return typeof a === "string" && a.length > 0;
  return !!(a && ((a.A || "").trim() || (a.B || "").trim()));
}
function choose(letter){
  answers[current] = letter;
  render();
}
function writeAnswer(part, value){
  if(!answers[current] || typeof answers[current] !== "object") answers[current] = {};
  answers[current][part] = value;
  const count = Object.keys(answers).filter(k => hasAnswer(Number(k))).length;
  $("progress").textContent = `Javob belgilangan savollar: ${count} / ${TOTAL_QUESTIONS}`;
}
function go(i){ current = i; render(); }
function move(delta){
  current = Math.max(0, Math.min(TOTAL_QUESTIONS-1, current+delta));
  render();
}
function normalizeAnswer(value){
  return String(value || "")
    .toLowerCase()
    .replace(/,/g, ".")
    .replace(/\s+/g, "")
    .replace(/−/g, "-")
    .replace(/π/g, "pi");
}
function finish(auto){
  if(examFinished) return;
  if(!auto && !confirm("Testni yakunlaysizmi?")) return;
  examFinished = true;
  clearInterval(timerInterval);

  let correct = 0;
  let attempted = 0;

  for(let i=0; i<MC_COUNT; i++){
    if(hasAnswer(i)){
      attempted++;
      if(answers[i] === answerKey[i]) correct++;
    }
  }
  for(let i=MC_COUNT; i<TOTAL_QUESTIONS; i++){
    const user = answers[i] || {};
    const key = writtenKey[i-MC_COUNT] || ["",""];
    ["A","B"].forEach((part, j) => {
      if((user[part] || "").trim() !== ""){
        attempted++;
        if(normalizeAnswer(user[part]) === normalizeAnswer(key[j])) correct++;
      }
    });
  }

  const maxScore = 55;
  const percent = (correct / maxScore * 100).toFixed(1);
  $("exam").classList.add("hidden");
  $("result").classList.remove("hidden");
  $("scoreText").textContent = `${correct} / ${maxScore} ball`;
  $("resultText").textContent =
    `Foiz: ${percent}%. Kiritilgan javoblar: ${attempted}. ` +
    (auto ? "Vaqt tugagani uchun test avtomatik yakunlandi." : "Test yakunlandi.");
}
</script>
